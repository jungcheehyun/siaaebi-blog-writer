name: Build friend-installable Windows setup

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/build-installer.yml"

permissions:
  contents: write

concurrency:
  group: siaaebi-installer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create baby-pencil installer icon
        shell: pwsh
        run: |
          python -m pip install Pillow
          python installer/create_icon.py
          if ($LASTEXITCODE -ne 0) { throw "Icon generation failed" }
          if (!(Test-Path installer/siaaebi_icon.ico)) { throw "ICO missing" }
      - name: Download and validate latest Windows app package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view --json tagName --jq '.tagName'
          if ($LASTEXITCODE -ne 0 -or !$tag) { throw "Latest release unavailable" }
          "SIA_VERSION=$tag" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force installer/payload/app | Out-Null
          gh release download "$tag" --pattern "siaaebi-update.zip" --dir installer/payload --clobber
          if ($LASTEXITCODE -ne 0) { throw "Download failed" }
          Expand-Archive -LiteralPath installer/payload/siaaebi-update.zip -DestinationPath installer/payload/app -Force
          foreach ($exe in @("SiaAebiBlogWriter.exe", "SiaAebiUpdater.exe")) {
            if (!(Test-Path "installer/payload/app/$exe")) { throw "Missing app file: $exe" }
          }
          if (!(Test-Path installer/payload/app/_internal)) { throw "PyInstaller dependency folder missing" }
      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Cannot install Inno Setup" }
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler missing" }
          & $compiler "/DSiaVersion=$env:SIA_VERSION" "installer/SiaAebi.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          $setup = "installer_dist/SiaAebiBlogWriter_Setup_$env:SIA_VERSION.exe"
          if (!(Test-Path $setup)) { throw "Installer not found: $setup" }
          Write-Output "Installer created: $setup"
          Get-FileHash $setup -Algorithm SHA256
      - name: Attach installer to the existing release (do not change latest tag)
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "installer_dist/SiaAebiBlogWriter_Setup_$env:SIA_VERSION.exe"
          gh release upload "$env:SIA_VERSION" "$setup" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Installer upload failed" }
          gh release view "$env:SIA_VERSION" --json assets --jq '.assets[].name'
